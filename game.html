able": false, "script": "", "hint": ""}, {"id": "deli-counter", "title": "Deli Counter", "blurb": "Take a number. Know your order. Say “um” and you’re going to the back.", "playable": false, "script": "", "hint": ""}, {"id": "tourist-trap", "title": "Tourist Trap", "blurb": "Get through Times Square without a bus tour, a fake bag, or a flyer for a show you don’t want.", "playable": false, "script": "", "hint": ""}, {"id": "fire-escape", "title": "Fire Escape", "blurb": "Dinner on the fire escape. Don’t drop the fork, and wave to the pigeon like you live here.", "playable": false, "script": "", "hint": ""}, {"id": "crosswalk-chicken", "title": "Crosswalk Chicken", "blurb": "The light is orange and the taxi is rolling. Walk like you mean it.", "playable": false, "script": "", "hint": ""}, {"id": "laundromat-roulette", "title": "Laundromat Roulette", "blurb": "You were gone twenty minutes. Your wet clothes are on the table. Get them in the dryer.", "playable": false, "script": "", "hint": ""}];

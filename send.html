  <tr>
    <td>
      <div class="inner">
        <h1>Send To A Friend</h1>
        <p>Send a NYClip to a friend, the old fashioned way.</p>
        <form class="form" onsubmit="return sendClip(this);">
          <p><label>Your email</label><input type="email" name="from"></p>
          <p><label>Your friend’s email</label><input type="email" name="to"></p>
          <p><label>Which game?</label>
            <select name="game" id="gameSelect">
            <option value="subway-shuffle">Subway Shuffle</option>
            <option value="everything-bagel">Everything Bagel</option>
            <option value="rooftop-run">Rooftop Run</option>
            <option value="taxi-dash">Taxi Dash</option>
            <option value="alternate-side">Alternate Side</option>
            <option value="coffee-regular">Coffee Regular</option>
            <option value="walk-up">Walk-Up</option>
            <option value="scaffolding-maze">Scaffolding Maze</option>
            <option value="stoop-sale">Stoop Sale</option>
            <option value="metrocard-swipe">MetroCard Swipe</option>
            <option value="deli-counter">Deli Counter</option>
            <option value="tourist-trap">Tourist Trap</option>
            <option value="fire-escape">Fire Escape</option>
            <option value="crosswalk-chicken">Crosswalk Chicken</option>
            <option value="laundromat-roulette">Laundromat Roulette</option>
            </select>
          </p>
          <p><label>A short message</label><textarea name="msg"></textarea></p>
          <p><input class="btn" type="submit" value="Send"></p>
        </form>
      </div>
<script>
(function() {
  var q = new URLSearchParams(location.search);
  var id = q.get("game");
  if (id) {
    var s = document.getElementById("gameSelect");
    if (s) s.value = id;
  }
})();
function sendClip(f) {
  var a = f.from.value || "";
  var b = f.to.value || "";
  var ok = /\S+@\S+\.\S+/;
  if (!ok.test(a) || !ok.test(b)) {
    alert("Please make sure both email addresses are in the format yourname@company.com.");
    return false;
  }
  alert("Your NYClip has been sent! (Or it would have been, if this were 2001.)");
  return false;
}
</script>

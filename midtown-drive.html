<style>
:root{
  --panel:#f2f4f1; --ink:#1b211e; --muted:#58625c; --sign:#1b5e3b;
  color-scheme:light dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --panel:#1b2220; --ink:#eef2ef; --muted:#a6b0aa; } }
:root[data-theme="dark"]{ --panel:#1b2220; --ink:#eef2ef; --muted:#a6b0aa; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#bfd0da;
  font-family:Overpass,"Highway Gothic","Arial Narrow",Arial,sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
.sign{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 14px);
  display:flex;flex-direction:column;align-items:flex-start;gap:5px;pointer-events:none}
.blade{background:var(--sign);color:#fff;font-weight:700;font-size:clamp(17px,2.3vw,24px);line-height:1;
  padding:8px 16px 5px;border:2px solid #fff;border-radius:5px;box-shadow:0 0 0 2px var(--sign),0 3px 10px rgba(0,0,0,.25);
  min-width:9.5em;letter-spacing:.01em;white-space:nowrap}
.blade .sm{font-size:.68em;font-weight:700}
.menuBtn{pointer-events:auto;margin-top:6px;font:inherit;font-weight:700;font-size:14px;color:#fff;background:rgba(20,26,24,.5);
  border:2px solid rgba(255,255,255,.7);border-radius:6px;padding:6px 12px 3px;cursor:pointer}
.speedo{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 18px);
  color:#fff;text-align:right;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.speedo #mph{font-size:clamp(44px,6vw,64px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.speedo .unit{font-size:16px;font-weight:700;margin-left:4px}
.speedo .sub{font-size:15px;font-weight:700;margin-top:2px;opacity:.92}
.race{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);
  color:#fff;text-align:center;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.mini{position:fixed;left:auto;top:calc(env(safe-area-inset-top,0px) + 128px);right:calc(env(safe-area-inset-right,0px) + 18px);
  width:150px;height:150px;border-radius:8px;pointer-events:none}
@media (max-width:600px){.mini{width:110px;height:110px}}
.mini[hidden],.race[hidden],.wrong[hidden],.touch[hidden],.intro[hidden]{display:none}
.race .pos{font-size:clamp(38px,5vw,52px);font-weight:800;line-height:1}
.race .pos small{font-size:.4em;font-weight:700}
.race .meta{font-size:15px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.wrong{position:fixed;top:calc(env(safe-area-inset-top,0px) + 112px);left:50%;transform:translateX(-50%);
  background:#c8102e;color:#fff;font-weight:800;font-size:20px;padding:8px 18px 5px;border:2px solid #fff;
  box-shadow:0 0 0 2px #c8102e;border-radius:3px;pointer-events:none}
.count{position:fixed;top:30%;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:clamp(90px,16vw,160px);
  line-height:1;pointer-events:none;text-shadow:0 6px 0 var(--sign),0 10px 30px rgba(0,0,0,.4)}
.banner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 150px);left:50%;transform:translateX(-50%);max-width:90vw;
  background:var(--sign);color:#fff;font-weight:700;font-size:17px;padding:9px 16px 6px;border:2px solid #fff;
  box-shadow:0 0 0 2px var(--sign);border-radius:5px;text-align:center;pointer-events:none;transition:opacity .4s}
.pops{position:fixed;top:36%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.pop{font-weight:800;font-size:clamp(24px,3.4vw,34px);color:#fff;white-space:nowrap;
  text-shadow:0 3px 0 #b0102a,0 6px 16px rgba(0,0,0,.45);animation:pop 1.4s ease-out forwards}
.pop.small{font-size:20px;text-shadow:0 2px 0 #333,0 4px 12px rgba(0,0,0,.4)}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}14%{transform:scale(1.2) rotate(4deg);opacity:1}
  28%{transform:scale(1) rotate(-2deg)}75%{opacity:1}100%{transform:translateY(-50px);opacity:0}}
@media (prefers-reduced-motion: reduce){.pop{animation:fade 1.4s forwards}@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}}
.touch{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding:0 calc(env(safe-area-inset-right,0px) + 14px) 0 calc(env(safe-area-inset-left,0px) + 14px);
  display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.touch .grp{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.touch button{font:inherit;font-weight:800;font-size:16px;color:#fff;background:rgba(20,26,24,.55);
  border:2px solid rgba(255,255,255,.7);border-radius:14px;width:72px;height:72px;touch-action:none;-webkit-tap-highlight-color:transparent}
.touch button.on{background:rgba(14,106,68,.85)}
.touch .gas{height:104px}
.touch .small{width:56px;height:56px;font-size:13px}
.intro{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(18,24,22,.4);overflow:auto}
.card{background:var(--panel);color:var(--ink);max-width:460px;width:100%;border-radius:10px;padding:26px 26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card .blade{display:inline-block;min-width:0;font-size:30px;padding:10px 18px 6px;margin:0 0 18px}
.card h1{margin:0;font:inherit}
.card p{margin:0 0 12px;line-height:1.5;font-size:16px;color:var(--muted)}
.card p.lead{color:var(--ink)}
.card .btns{display:grid;gap:10px;margin-top:14px}
.card button{font:inherit;font-weight:800;font-size:18px;width:100%;padding:14px 0 11px;border:2px solid var(--sign);border-radius:8px;
  background:var(--sign);color:#fff;cursor:pointer}
.card button.alt{background:transparent;color:var(--ink)}
.card button:focus-visible,.touch button:focus-visible,.menuBtn:focus-visible{outline:3px solid #ffc233;outline-offset:2px}

.nyclip-back{
  position:fixed;left:14px;bottom:12px;z-index:8;
  font:700 12px Arial,Helvetica,sans-serif;
  color:#fff;background:#1b5e3b;border:2px solid #fff;
  padding:5px 10px 4px;text-decoration:none;
  box-shadow:0 0 0 2px #1b5e3b;
}
.nyclip-back:visited{color:#fff}
.nyclip-back:hover{background:#163d28;color:#fccc0a}

<script>
window.CarPhys=(function(){
  // Units: ~metres, seconds, kg, newtons. Heavy, soft, slightly loose: the GTA IV recipe.
  const P={m:1650,I:4600,a:1.3,b:1.3,hcg:.6,Cf:48000,Cr:60000,mu:.92,muR:1.08,engine:6600,vmax:44,brake:12000,
           rev:4200,vrev:9,drag:.55,roll:45,hbMu:.38,g:9.8};
  function make(x,z,h){return{x,z,h,vx:0,vz:0,w:0,steer:0,delta:0,ax:0,ar:0,vf:0,slip:0,spin:0,
    hw:1,hl:2.1,m:P.m,invM:1/P.m,invI:1/P.I};}
  function step(c,inp,dt){
    const L=P.a+P.b,sh=Math.sin(c.h),ch=Math.cos(c.h),fx=-sh,fz=-ch,rx=ch,rz=-sh;
    const vf=c.vx*fx+c.vz*fz, vr=c.vx*rx+c.vz*rz, sp=Math.abs(vf);
    // steering column: slow to turn in, quicker to return to centre
    const tgt=inp.steer||0, rate=inp.rate||2.1;
    const r=(tgt===0||tgt*c.steer<0)?Math.max(rate,4.2):rate;
    c.steer+=Math.max(-r*dt,Math.min(r*dt,tgt-c.steer));
    const delta=c.steer*.62/(1+sp/15); c.delta=delta;
    const th=inp.throttle||0, br=inp.brake||0;
    let Ft=0,Fb=0;
    const stopF=sp*P.m/dt;
    if(inp.park){Fb=-Math.sign(vf)*Math.min(stopF,8500);}
    else{
      if(th>0){ if(vf<-.5) Fb=Math.min(stopF,P.brake*th); else Ft=P.engine*th*Math.max(0,1-(vf/P.vmax)**2); }
      if(br>0){ if(vf>.5) Fb=-Math.min(stopF,P.brake*br); else if(vf>-P.vrev) Ft=-P.rev*br*(1-Math.max(0,-vf)/P.vrev); }
      if(inp.hb) Fb+=-Math.sign(vf)*Math.min(stopF,4500);
    }
    // longitudinal weight transfer (lagged: the body has to pitch before the load moves)
    const Wf=Math.max(600,P.m*P.g*P.b/L-P.hcg/L*P.m*c.ax), Wr=Math.max(600,P.m*P.g*P.a/L+P.hcg/L*P.m*c.ax);
    const vfe=Math.max(sp,3), sg=vf>=0?1:-1;
    const af=Math.atan2(vr-c.w*P.a,vfe)+delta*sg;
    const ar=Math.atan2(vr+c.w*P.b,vfe);
    const muR=P.muR*(inp.hb?P.hbMu:1);
    Ft=Math.max(-P.muR*Wr,Math.min(P.muR*Wr,Ft));          // wheelspin cap
    const tr=Math.abs(Ft)/(P.muR*Wr);                       // friction circle on the driven axle
    const capF=P.mu*Wf, capR=muR*Wr*Math.sqrt(Math.max(.3,1-tr*tr));
    const Ff=Math.max(-capF,Math.min(capF,-P.Cf*af));
    const Fr=Math.max(-capR,Math.min(capR,-P.Cr*ar));
    const cd=Math.cos(delta),sd=Math.sin(delta);
    const coast=inp.park?0:Math.min(stopF,330+(th>0?0:Math.min(1300,75*sp)));
    const Fd=-P.drag*vf*sp-P.roll*vf-Math.sign(vf)*coast;
    const Fx=Ft+Fb+Fd+Ff*sd, Fy=Ff*cd+Fr;
    c.ax+=(Fx/P.m-c.ax)*Math.min(1,6*dt); c.ar=Fy/P.m;
    c.vx+=(fx*Fx+rx*Fy)/P.m*dt; c.vz+=(fz*Fx+rz*Fy)/P.m*dt;
    c.w+=(-P.a*Ff*cd+P.b*Fr)/P.I*dt;
    if(sp<3){ // parking-lot speeds: blend to kinematic steering so the car doesn't shimmy
      const k=1-sp/3, wk=vf*Math.tan(delta)/L;
      c.w+=(wk-c.w)*Math.min(1,k*10*dt);
      const vr2=c.vx*rx+c.vz*rz,kill=vr2*Math.min(1,k*6*dt); c.vx-=rx*kill; c.vz-=rz*kill;
    }
    if(!th&&!br&&sp<.08&&Math.abs(vr)<.08){c.vx=0;c.vz=0;}
    c.x+=c.vx*dt; c.z+=c.vz*dt; c.h+=c.w*dt;
    c.vf=vf; c.slip=Math.abs(vr+c.w*P.b)+(tr>.97&&th>0?4:0);
  }
  return {P,make,step};
})();
</script>
<script>
(function(){
"use strict";
// ================= grid =================
const AV=110, AW=9, ST=40, SW=5.5, SWK=4.5; // avenue spacing/half-width, street spacing/half-width, sidewalk width
const AVES=[['10',1],['9',-1],['8',1],['7',-1],['6',1],['5',-1],['Madison',1],['Park',0],['Lexington',-1],['3',1]];
const N=AVES.length, FIRST=33, M=25;
const XMIN=-AW, XMAX=(N-1)*AV+AW, ZMAX=SW, ZMIN=-(M-1)*ST-SW;
const roadArea=(x,z)=>Math.abs(x-Math.round(x/AV)*AV)<AW||Math.abs(z-Math.round(z/ST)*ST)<SW;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd=mulberry32(1976), R=Math.random;
const pick=a=>a[Math.floor(R()*a.length)], ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;};
const blockRect=(bi,bj)=>[bi*AV+AW,(bi+1)*AV-AW,-(bj+1)*ST+SW,-bj*ST-SW]; // x0,x1,z0(north),z1(south)

// ================= three =================
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const SKY=0xbfd0da;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,90,560);
const camera=new THREE.PerspectiveCamera(60,1,0.3,1400);
scene.add(new THREE.HemisphereLight(0xe4edf3,0x6f6558,0.85));
const sun=new THREE.DirectionalLight(0xffe4bd,0.8); sun.position.set(-3,4,1.5); scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();

function Builder(){this.p=[];this.n=[];this.c=[];this.uv=[];this.i=[];}
Builder.prototype.quad=function(vs,nrm,col,uvs){
  const b=this.p.length/3;
  for(const v of vs){this.p.push(v[0],v[1],v[2]);this.n.push(nrm[0],nrm[1],nrm[2]);this.c.push(col.r,col.g,col.b);}
  for(const u of uvs) this.uv.push(u);
  this.i.push(b,b+1,b+2,b,b+2,b+3);
};
const FLAT=[.02,.98,.02,.98,.02,.98,.02,.98];
Builder.prototype.box=function(x0,x1,y0,y1,z0,z1,col,tex){
  const a=y0/4,b=y1/4;
  this.quad([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],[0,0,1],col,tex?[x0/5,a,x1/5,a,x1/5,b,x0/5,b]:FLAT);
  this.quad([[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]],[0,0,-1],col,tex?[-x1/5,a,-x0/5,a,-x0/5,b,-x1/5,b]:FLAT);
  this.quad([[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]],[1,0,0],col,tex?[-z1/5,a,-z0/5,a,-z0/5,b,-z1/5,b]:FLAT);
  this.quad([[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],[-1,0,0],col,tex?[z0/5,a,z1/5,a,z1/5,b,z0/5,b]:FLAT);
  this.quad([[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0]],[0,1,0],col,FLAT);
};
Builder.prototype.geo=function(){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(this.p,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(this.n,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(this.c,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(this.uv,2));
  g.setIndex(this.i); return g;
};
const cv=document.createElement('canvas'); cv.width=cv.height=64;
const g2=cv.getContext('2d');
g2.fillStyle='#fff'; g2.fillRect(0,0,64,64);
g2.fillStyle='#e2e0da'; g2.fillRect(0,56,64,4);
g2.fillStyle='#4f5a65'; g2.fillRect(8,14,19,36); g2.fillRect(37,14,19,36);
g2.fillStyle='#75838f'; g2.fillRect(8,14,19,8); g2.fillRect(37,14,19,8);
const tex=new THREE.CanvasTexture(cv);
tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
tex.anisotropy=renderer.capabilities.getMaxAnisotropy();

const C=h=>new THREE.Color(h);
const BOX=new THREE.BoxGeometry(1,1,1);
const _o=new THREE.Object3D();
function setInst(m,k,it,vis){
  _o.position.set(it.p[0],it.p[1],it.p[2]);_o.rotation.set(0,it.r||0,0);
  const s=it.s||[1,1,1]; if(vis===false)_o.scale.set(0,0,0); else _o.scale.set(s[0],s[1],s[2]);
  _o.updateMatrix(); m.setMatrixAt(k,_o.matrix); m.instanceMatrix.needsUpdate=true;
}
function inst(geo,mat,items){
  const m=new THREE.InstancedMesh(geo,mat,Math.max(1,items.length));
  m.frustumCulled=false; m.userData.items=items;
  items.forEach((it,k)=>setInst(m,k,it));
  if(!items.length) m.count=0;
  scene.add(m); return m;
}
function pool(geo,mat,count,colored){
  const m=new THREE.InstancedMesh(geo,mat,count);
  m.frustumCulled=false; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const z=new THREE.Matrix4().makeScale(0,0,0), w=new THREE.Color(1,1,1);
  for(let k=0;k<count;k++){m.setMatrixAt(k,z); if(colored) m.setColorAt(k,w);}
  scene.add(m); return m;
}
const ZERO=new THREE.Matrix4().makeScale(0,0,0);

// ================= city =================
const ground=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.MeshLambertMaterial({color:0x3a3c40}));
ground.rotation.x=-Math.PI/2; ground.position.set(500,0,-480); scene.add(ground);

const statics=[];
function addStatic(x,z,hw,hl,kind){const b={x,z,h:0,hw,hl,vx:0,vz:0,w:0,invM:0,invI:0,kind,q:0};statics.push(b);return b;}

const city=new Builder();
const SIDEWALK=C(0x9d9990);
const LOW=[0xa65b44,0x8f4c3b,0xb7704f,0xd6ccb8,0xc4b9a4,0x9c9a95,0x7b6f64,0xbfa98a];
const TALL=[0x7d93a8,0x5f6f7f,0xb9c2c9,0x8a8f96,0xd2c8b4,0x6d7a86];
const towers=[];
function building(x0,x1,z0,z1,i){
  const f=0.35+0.65*Math.exp(-Math.pow((i-4.5)/3,2));
  const h=12+rnd()*16+Math.pow(rnd(),4)*115*f;
  const pal=h>55?TALL:LOW;
  const col=C(pal[Math.floor(rnd()*pal.length)]).offsetHSL(0,0,(rnd()-.5)*.07);
  if(h>55&&x1-x0>9&&z1-z0>9){
    const h1=16+rnd()*18;
    city.box(x0,x1,.25,h1,z0,z1,col,true);
    city.box(x0+2.2,x1-2.2,h1,h,z0+2.2,z1-2.2,col,true);
  } else {
    city.box(x0,x1,.25,h,z0,z1,col,true);
    if(h<45&&rnd()<.3&&x1-x0>6) towers.push([(x0+x1)/2+(rnd()-.5)*2,h,(z0+z1)/2]);
  }
}
function fill(xa,xb,z0,z1,i){
  const zm=(z0+z1)/2;
  for(const [za,zb] of [[z0,zm],[zm,z1]]){
    let x=xa;
    while(x<xb-3){let w=8+rnd()*14; if(xb-(x+w)<7) w=xb-x; building(x,x+w,za,zb,i); x+=w;}
  }
}
function tier(cx,cz,w,d,y0,y1,col){city.box(cx-w/2,cx+w/2,y0,y1,cz-d/2,cz+d/2,col,true);}

// ================= collision =================
function basis(b){const s=Math.sin(b.h),c=Math.cos(b.h);return [-s,-c,c,-s];} // fx,fz,rx,rz
function corners(b,e){const o=[];for(const sr of [-1,1])for(const sf of [-1,1])o.push(b.x+e[2]*b.hw*sr+e[0]*b.hl*sf,b.z+e[3]*b.hw*sr+e[1]*b.hl*sf);return o;}
function inBox(b,e,x,z,m){const dx=x-b.x,dz=z-b.z;return Math.abs(dx*e[2]+dz*e[3])<=b.hw+m&&Math.abs(dx*e[0]+dz*e[1])<=b.hl+m;}
const CN={nx:0,nz:0,depth:0,px:0,pz:0};
function sat(A,B){ // separating-axis test on the real rectangles; normal points A -> B
  const a=basis(A),b=basis(B), dx=B.x-A.x, dz=B.z-A.z;
  let best=1e9,nx=0,nz=0;
  const axes=[a[2],a[3],a[0],a[1],b[2],b[3],b[0],b[1]];
  for(let k=0;k<8;k+=2){
    const ax=axes[k],az=axes[k+1];
    const ra=A.hw*Math.abs(a[2]*ax+a[3]*az)+A.hl*Math.abs(a[0]*ax+a[1]*az);
    const rb=B.hw*Math.abs(b[2]*ax+b[3]*az)+B.hl*Math.abs(b[0]*ax+b[1]*az);
    const d=dx*ax+dz*az, ov=ra+rb-Math.abs(d);

  for(let k=0;k<8;k+=2){ if(inBox(B,b,ca[k],ca[k+1],.01)){cx+=ca[k];cz+=ca[k+1];n++;} if(inBox(A,a,cb[k],cb[k+1],.01)){cx+=cb[k];cz+=cb[k+1];n++;} }

  CN.nx=nx;CN.nz=nz;CN.depth=best;CN.px=cx/n;CN.pz=cz/n; return CN;
}
function applyImp(b,jx,jz,rx,rz){ if(!b.invM) return; b.vx+=jx*b.invM; b.vz+=jz*b.invM; b.w-=(rx*jz-rz*jx)*b.invI; }

  A.x-=c.nx*corr*iA; A.z-=c.nz*corr*iA; B.x+=c.nx*corr*iB; B.z+=c.nz*corr*iB;
  const rAx=c.px-A.x,rAz=c.pz-A.z,rBx=c.px-B.x,rBz=c.pz-B.z;
  const vAx=A.vx+A.w*rAz,vAz=A.vz-A.w*rAx,vBx=B.vx+B.w*rBz,vBz=B.vz-B.w*rBx;
  const rvx=vBx-vAx,rvz=vBz-vAz, vn=rvx*c.nx+rvz*c.nz;

  const j=-(1+e)*vn/(tot+cA*cA*A.invI+cB*cB*B.invI);
  applyImp(A,-j*c.nx,-j*c.nz,rAx,rAz); applyImp(B,j*c.nx,j*c.nz,rBx,rBz);
  let tx=rvx-vn*c.nx,tz=rvz-vn*c.nz; const tl=Math.hypot(tx,tz);

    let jt=-(rvx*tx+rvz*tz)/(tot+cAt*cAt*A.invI+cBt*cBt*B.invI); jt=clamp(jt,-mu*j,mu*j);
    applyImp(A,-jt*tx,-jt*tz,rAx,rAz); applyImp(B,jt*tx,jt*tz,rBx,rBz);}

function planPath(r,fi,fj,pre){

}

  else if(j>6000){const d=Math.hypot(A.x-me.x,A.z-me.z);if(d<70)sfx.thud(Math.min(.6,j/40000)*(1-d/70));}

    const c=sat(A,B); if(c){ if(A===me&&B.blame!=='me'){B.blame='me';B.blameT=5;} if(B===me){A.blame='me';A.blameT=5;} onImpact(A,B,resolve(A,B,c,.22,.4)); }

function updateTraffic(dt,L){

    if(race.on&&race.count<=0){

      for(const r of rivals) if(r.active&&!r.done) checkCp(r.c);
    }
    updateRig(myRig,me,dt); for(const r of rivals) if(r.active) updateRig(r.rig,r.c,dt);
    if(bannerT>0){bannerT-=dt;if(bannerT<=0)$banner.style.opacity=0;}
    subT-=dt;
    if(subT<0){let best=1e9;for(const [x,z] of subways)best=Math.min(best,Math.hypot(x-me.x,z-me.z));
      if(best<40){sfx.rumble(1-best/50);shake=Math.max(shake,.12);subT=16+R()*18;} else subT=3;}
    sirenT-=dt; if(sirenT<0){sfx.siren();sirenT=40+R()*50;}
    audioTick(mode!=='menu',counting?0:(keys.up?1:0));
    if(ring.visible) ring.material.opacity=.55+Math.sin(T*6)*.2;
    if(mode==='race'&&(++miniF%3===0)) drawMini();
    if(fare.visible) fare.userData.arm.rotation.z=2.6+Math.sin(T*9)*.5;
    if(arrow.visible){arrow.position.set(me.x,myRig.y+2.45+Math.sin(T*4)*.1,me.z);{const t=race.cps[Math.min(me.cp,race.cps.length-1)];arrow.rotation.y=Math.atan2(-(t.x-me.x),-(t.z-me.z));}}
    hud();
  }
  // GTA-style chase camera: swings toward where the car is actually going, not just where it points
  const spd=Math.hypot(me.vx,me.vz); let ty=me.h;
  if(spd>4&&me.vf>0) ty=me.h+clamp(wrapA(Math.atan2(-me.vx,-me.vz)-me.h),-.9,.9)*.55;
  if(mode==='menu') ty=me.h+Math.sin(performance.now()/4000)*.6;
  camYaw+=wrapA(ty-camYaw)*Math.min(1,3.2*dt);
  const dist=7.6+spd*.07, fx=-Math.sin(camYaw), fz=-Math.cos(camYaw);
  camPos.set(me.x-fx*dist,3.1+spd*.02+myRig.y,me.z-fz*dist);
  camera.position.lerp(camPos,1-Math.exp(-10*dt));
  shake*=Math.pow(.02,dt);
  camera.lookAt(me.x+fx*4+(R()-.5)*shake,1.3+myRig.y+(R()-.5)*shake,me.z+fz*4+(R()-.5)*shake);
  const fov=58+spd*.42; if(Math.abs(camera.fov-fov)>.05){camera.fov=fov;camera.updateProjectionMatrix();}
  updateRig(myRig,me,0);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
dyn.push(me);
updatePeds(0,dyn); updateBikes(0,lights(0)); updateRig(myRig,me,0);
showMenu('intro');
window.__md={me,rivals,race,cars,peds,bikes,carts,gibs,get splats(){return splats;},keys};
requestAnimationFrame(frame);
})();
